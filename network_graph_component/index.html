<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; color-scheme: light; overflow: hidden; }
      #network-graph { position: relative; width: 100%; min-height: 480px; }
      #network-graph svg { display: block; width: 100%; height: 100%; margin: 0 auto; }
      #network-graph g.node { cursor: pointer; transition: opacity 160ms ease; }
      #network-graph g.node:focus { outline: none; }
      #network-graph g.node:focus-visible ellipse { stroke: #f59e0b !important; stroke-width: 6px !important; filter: drop-shadow(0 0 3px rgba(245, 158, 11, .65)); }
      #network-graph g.edge { transition: opacity 160ms ease; }
      #network-graph g.node.dimmed, #network-graph g.edge.dimmed { opacity: .13; }
      #network-graph g.node.focused ellipse { stroke: #0f172a !important; stroke-width: 6px !important; }
      #network-graph g.node.neighbor ellipse { stroke: #2563eb !important; stroke-width: 5px !important; stroke-dasharray: 5 3; }
      #network-graph g.edge.connected path { stroke: #2563eb !important; stroke-width: 3px !important; }
      #network-graph g.edge.connected polygon { fill: #2563eb !important; stroke: #2563eb !important; }
      #network-graph g.edge.incoming path { stroke: #be123c !important; stroke-dasharray: 8 4; }
      #network-graph g.edge.incoming polygon { fill: #be123c !important; stroke: #be123c !important; }
      #network-graph g.edge.outgoing path { stroke: #0891b2 !important; }
      #network-graph g.edge.outgoing polygon { fill: #0891b2 !important; stroke: #0891b2 !important; }
      .sphere-canvas { width: 100%; height: 100%; display: block; border-radius: 12px; background: #fff; touch-action: none; cursor: grab; }
      .sphere-canvas.dragging { cursor: grabbing; }
      .sphere-canvas:focus-visible { outline: 2px solid #2563eb; outline-offset: -3px; }
      .sphere-control svg { width: 16px !important; height: 16px !important; }
      .sphere-controls { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid rgba(148,163,184,.48); border-radius: 10px; background: rgba(255,255,255,.94); box-shadow: 0 3px 12px rgba(15,23,42,.14); }
      .sphere-control { min-width: 30px; height: 30px; padding: 0 7px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; color: #0f172a; font: 700 16px/1 Helvetica, Arial, sans-serif; cursor: pointer; }
      .sphere-control:hover { background: #eff6ff; border-color: #60a5fa; }
      .sphere-control:active:not(:disabled) { background: #dbeafe; border-color: #2563eb; transform: scale(.96); }
      .sphere-control { touch-action: manipulation; }
      .sphere-controls { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .sphere-control:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
      .sphere-control[aria-pressed="true"] { background: #dbeafe; border-color: #2563eb; color: #1d4ed8; }
      .sphere-control:disabled { opacity: .42; cursor: default; }
      .sphere-control.clear-focus { min-width: 30px; font-size: 16px; }
      .sphere-control-divider { width: 1px; height: 20px; background: #cbd5e1; margin: 0 1px; }
      .sphere-help { position: absolute; right: 12px; bottom: 10px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.85); color: #475569; font: 600 11px/1.2 Helvetica, Arial, sans-serif; pointer-events: none; }
      .sphere-labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .sphere-label { position: absolute; color: #e2e8f0; font: 600 11px/1.1 Helvetica, Arial, sans-serif; text-shadow: 0 1px 4px #020617; white-space: nowrap; }
      .sphere-accessible { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      @media (pointer: coarse) {
        .sphere-control, .sphere-control.clear-focus { min-width: 44px; height: 44px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #network-graph g.node, #network-graph g.edge { transition: none; }
        .sphere-control:active:not(:disabled) { transform: none; }
      }
      @media (prefers-reduced-transparency: reduce) {
        .sphere-controls, .sphere-help { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; }
      }
      @media (prefers-contrast: more) {
        .sphere-controls, .sphere-help { background: #fff; border: 1px solid #475569; }
        .sphere-control { border-color: #475569; }
      }
    </style>
  </head>
  <body>
    <div id="network-graph"></div>
    <p id="graph-status" class="sphere-accessible" role="status" aria-live="polite" aria-atomic="true"></p>
    <script src="camera-motion.js"></script>
    <script>
      const host = document.getElementById("network-graph");
      const parentOrigin = (() => { try { return new URL(document.referrer).origin; } catch (_) { return "*"; } })();
      let pendingFocusId = "", pendingClear = false, lastContextId = "", lastFrameHeight = 0;
      let cleanupRender = () => {}, storeCamera = () => {};
      const storageKey = (contextId, suffix) => `cana-network-focus:${contextId}:${suffix}`;
      const readStored = (key) => { try { return sessionStorage.getItem(key) || ""; } catch (_) { return ""; } };
      const writeStored = (key, value) => { try { sessionStorage.setItem(key, value); } catch (_) {} };
      const removeStored = (key) => { try { sessionStorage.removeItem(key); } catch (_) {} };
      const send = (type, payload) => parent.postMessage({ isStreamlitMessage: true, type, ...payload }, parentOrigin);
      const eventId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;

      function updateFrameHeight() {
        const width = document.documentElement.clientWidth || host.clientWidth || 650;
        const graphHeight = Math.max(480, Math.min(760, Math.round(width * .92)));
        host.style.height = `${graphHeight}px`;
        const height = graphHeight;
        if (Math.abs(height - lastFrameHeight) < 2) return;
        lastFrameHeight = height;
        send("streamlit:setFrameHeight", { height });
      }
      function sanitizeSvg(markup) {
        const parsed = new DOMParser().parseFromString(markup || "", "image/svg+xml");
        if (parsed.querySelector("parsererror") || parsed.documentElement.tagName.toLowerCase() !== "svg") return "";
        parsed.querySelectorAll("script,foreignObject,iframe,object,embed").forEach((element) => element.remove());
        parsed.querySelectorAll("*").forEach((element) => [...element.attributes].forEach((attribute) => {
          const name = attribute.name.toLowerCase(), value = attribute.value.trim();
          if (name.startsWith("on") || ((name === "href" || name.endsWith(":href")) && value && !value.startsWith("#"))) element.removeAttribute(attribute.name);
        }));
        return parsed.documentElement.outerHTML;
      }

      function mountThreeSphere(THREE, sphere, version, getFocused, setFocus, clearFocus, selectNode) {
        if (version !== renderVersion) return;
        host.innerHTML = '<canvas class="sphere-canvas" aria-label="Interactive 3D Boolean network. Drag to orbit, scroll to zoom, and click a node to select it."></canvas><div class="sphere-help">Drag to orbit · Scroll to zoom · Click a node to focus</div><div class="sphere-labels" aria-hidden="true"></div><div class="sphere-accessible" role="group" aria-label="3D Boolean network"></div>';
        const canvas = host.querySelector("canvas");
        const labelsLayer = host.querySelector(".sphere-labels");
        const accessible = host.querySelector(".sphere-accessible");
        const nodes = sphere.nodes || [], edges = sphere.edges || [];
        const radius = Math.max(...nodes.map((node) => Math.hypot(node.x, node.y, node.z)), 1);
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x07111f, 0.026);
        const camera = new THREE.PerspectiveCamera(38, 1, .1, radius * 20);
        camera.position.set(0, 0, radius * 3.55);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        renderer.setClearColor(0x07111f, .98);
        const world = new THREE.Group();
        world.rotation.set(.28, -.65, 0);
        scene.add(world);
        scene.add(new THREE.AmbientLight(0xb8d8ff, 1.5));
        const keyLight = new THREE.PointLight(0x8ec5ff, 18, radius * 10);
        keyLight.position.set(radius * 2.2, radius * 2.7, radius * 3.5);
        scene.add(keyLight);
        const rimLight = new THREE.PointLight(0xff8799, 10, radius * 9);
        rimLight.position.set(-radius * 3, -radius, -radius * 2);
        scene.add(rimLight);

        const orb = new THREE.Mesh(
          new THREE.IcosahedronGeometry(radius * .34, 2),
          new THREE.MeshStandardMaterial({ color: 0x173f6b, emissive: 0x0b213b, emissiveIntensity: 1, transparent: true, opacity: .72, wireframe: true })
        );
        world.add(orb);
        const ringMaterial = new THREE.LineBasicMaterial({ color: 0x4d91c6, transparent: true, opacity: .22 });
        [0, Math.PI / 3].forEach((rotation, index) => {
          const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
            Array.from({ length: 96 }, (_, step) => {
              const angle = step / 96 * Math.PI * 2;
              return new THREE.Vector3(Math.cos(angle) * radius * (index ? .82 : 1.05), 0, Math.sin(angle) * radius * (index ? .82 : 1.05));
            })
          ), ringMaterial.clone());
          ring.rotation.x = rotation + (index ? .55 : 0);
          world.add(ring);
        });

        const nodeMeshes = new Map();
        const labelElements = new Map();
        const edgeObjects = [];
        const sphereGeometry = new THREE.SphereGeometry(Math.max(.08, radius * .025), 18, 14);
        const outlineGeometry = new THREE.SphereGeometry(Math.max(.10, radius * .031), 18, 14);
        nodes.forEach((node, index) => {
          const group = new THREE.Group();
          group.position.set(node.x, node.y, node.z);
          group.userData.id = String(node.id);
          const outline = new THREE.Mesh(outlineGeometry, new THREE.MeshBasicMaterial({ color: node.outline, transparent: true, opacity: .95 }));
          const core = new THREE.Mesh(sphereGeometry, new THREE.MeshStandardMaterial({ color: node.fill, emissive: node.fill, emissiveIntensity: .18, roughness: .32, metalness: .08, transparent: true, opacity: 1 }));
          group.add(outline, core);
          world.add(group);
          nodeMeshes.set(String(node.id), { group, outline, core, node });
          const label = document.createElement("div");
          label.className = "sphere-label";
          label.textContent = node.label;
          labelsLayer.appendChild(label);
          labelElements.set(String(node.id), { element: label, overview: index < Math.min(10, nodes.length) });
          const button = document.createElement("button");
          button.type = "button"; button.textContent = `Select ${node.label}`;
          button.addEventListener("click", (event) => selectNode(String(node.id), event));
          accessible.appendChild(button);
        });
        edges.forEach((edge) => {
          const source = nodeMeshes.get(String(edge.source))?.group.position;
          const target = nodeMeshes.get(String(edge.target))?.group.position;
          if (!source || !target) return;
          const geometry = new THREE.BufferGeometry().setFromPoints([source, target]);
          const material = edge.dashed
            ? new THREE.LineDashedMaterial({ color: edge.color, dashSize: .12, gapSize: .08, transparent: true, opacity: .35 })
            : new THREE.LineBasicMaterial({ color: edge.color, transparent: true, opacity: .35 });
          const line = new THREE.Line(geometry, material);
          if (edge.dashed) line.computeLineDistances();
          world.add(line);
          edgeObjects.push({ edge, line, material });
        });

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let dragging = false, moved = false, startX = 0, startY = 0, zoom = 1;
        function connectedIds(focused) {
          const ids = new Set([focused]);
          edges.forEach((edge) => { if (String(edge.source) === focused || String(edge.target) === focused) { ids.add(String(edge.source)); ids.add(String(edge.target)); } });
          return ids;
        }
        function updateFocus() {
          const focused = getFocused();
          const related = focused ? connectedIds(focused) : null;
          nodeMeshes.forEach(({ outline, core }, id) => {
            const active = !related || related.has(id);
            const isFocused = id === focused, neighbor = Boolean(related && !isFocused && related.has(id));
            outline.material.color.set(isFocused ? "#f8fafc" : neighbor ? "#38bdf8" : nodeMeshes.get(id).node.outline);
            outline.material.opacity = active ? 1 : .08;
            core.material.opacity = active ? 1 : .08;
            core.scale.setScalar(isFocused ? 1.45 : 1);
          });
          edgeObjects.forEach(({ edge, material }) => {
            const active = !focused || String(edge.source) === focused || String(edge.target) === focused;
            const incoming = String(edge.target) === focused;
            material.opacity = active ? .95 : .045;
            material.color.set(incoming ? "#fb7185" : String(edge.source) === focused ? "#38bdf8" : edge.color);
          });
        }
        function resize() {
          const width = Math.max(1, host.clientWidth), height = Math.max(480, host.clientHeight);
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        function updateLabels() {
          const focused = getFocused(), related = focused ? connectedIds(focused) : null;
          const occupied = [];
          nodeMeshes.forEach(({ group }, id) => {
            const label = labelElements.get(id);
            const point = group.getWorldPosition(new THREE.Vector3()).project(camera);
            const visible = point.z < 1 && point.z > -1 && (!related ? label.overview : related.has(id));
            if (!visible) { label.element.style.display = "none"; return; }
            const x = (point.x * .5 + .5) * host.clientWidth, y = (-point.y * .5 + .5) * host.clientHeight;
            const collision = occupied.some(([px, py]) => Math.hypot(px - x, py - y) < 48);
            if (collision && id !== focused) { label.element.style.display = "none"; return; }
            occupied.push([x, y]);
            label.element.style.display = "block";
            label.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y - 15}px)`;
          });
        }
        function animate() {
          if (version !== renderVersion) { renderer.dispose(); return; }
          orb.rotation.y += .002;
          camera.position.z = radius * 3.55 / zoom;
          camera.lookAt(0, 0, 0);
          updateFocus();
          renderer.render(scene, camera);
          updateLabels();
          requestAnimationFrame(animate);
        }
        canvas.addEventListener("pointerdown", (event) => { dragging = true; moved = false; startX = event.clientX; startY = event.clientY; canvas.setPointerCapture(event.pointerId); canvas.classList.add("dragging"); });
        canvas.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          const dx = event.clientX - startX, dy = event.clientY - startY;
          if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
          world.rotation.y += dx * .008;
          world.rotation.x = Math.max(-1.25, Math.min(1.25, world.rotation.x + dy * .008));
          startX = event.clientX; startY = event.clientY;
        });
        canvas.addEventListener("pointerup", (event) => {
          dragging = false; canvas.classList.remove("dragging"); if (moved) return;
          const rect = canvas.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hit = raycaster.intersectObjects([...nodeMeshes.values()].map((entry) => entry.core), false)[0];
          if (hit) selectNode(hit.object.parent.userData.id); else clearFocus(true);
        });
        canvas.addEventListener("wheel", (event) => { event.preventDefault(); zoom = Math.max(.55, Math.min(2.3, zoom * (event.deltaY > 0 ? .91 : 1.1))); }, { passive: false });
        new ResizeObserver(resize).observe(host);
        resize(); animate();
      }

      function render(args) {
        cleanupRender(); cleanupRender = () => {}; storeCamera = () => {};
        const activeId = document.activeElement?.id;
        const contextId = String(args.context_id || "");
        if (contextId !== lastContextId) {
          if (lastContextId) { removeStored(storageKey(lastContextId, "node")); removeStored(storageKey(lastContextId, "clear")); }
          pendingFocusId = readStored(storageKey(contextId, "node"));
          pendingClear = readStored(storageKey(contextId, "clear")) === "1";
          lastContextId = contextId;
        }
        const isSphere = args.view_mode === "3D sphere";
        const sphere = args.sphere_data || { nodes: [], edges: [] };
        const nodeById = new Map((sphere.nodes || []).map((node) => [String(node.id), node]));
        let focusedNodeId = null, svgNodes = [], svgEdges = [], drawSphere = () => {};
        const graphId = (element) => element.dataset.graphId || "";
        const edgeEndpoints = (edge) => {
          const parts = graphId(edge).split("->");
          return parts.length === 2 ? parts.map((part) => part.trim().replace(/:(n|ne|e|se|s|sw|w|nw|c|_)$/i, "")) : [];
        };
        const relation = (nodeId) => {
          const ids = new Set([nodeId]), edges = new Set();
          (sphere.edges || []).forEach((edge) => {
            if (String(edge.source) === nodeId || String(edge.target) === nodeId) { ids.add(String(edge.source)); ids.add(String(edge.target)); edges.add(edge); }
          });
          return { ids, edges };
        };
        function applySvgFocus() {
          const related = focusedNodeId ? relation(focusedNodeId) : null;
          svgNodes.forEach((node) => {
            const id = graphId(node), focused = id === focusedNodeId;
            node.classList.toggle("focused", focused);
            node.classList.toggle("neighbor", Boolean(related && !focused && related.ids.has(id)));
            node.classList.toggle("dimmed", Boolean(related && !related.ids.has(id)));
            if (focused) node.setAttribute("aria-current", "true"); else node.removeAttribute("aria-current");
          });
          svgEdges.forEach((edge) => {
            const [source, target] = edgeEndpoints(edge), connected = Boolean(related && (source === focusedNodeId || target === focusedNodeId));
            edge.classList.toggle("connected", connected); edge.classList.toggle("dimmed", Boolean(related && !connected));
            edge.classList.toggle("incoming", target === focusedNodeId); edge.classList.toggle("outgoing", source === focusedNodeId);
          });
        }
        function setFocus(nodeId) {
          focusedNodeId = nodeId || null;
          const node = nodeById.get(focusedNodeId);
          const status = document.getElementById("graph-status");
          if (status) status.textContent = node ? `${node.label} · ${node.type || "Node"} · Node color value: ${Number(node.value || 0).toFixed(3)} · ${relation(focusedNodeId).edges.size} visible connected edges. Incoming edges are dashed; outgoing edges are solid.` : "All nodes shown. Choose a node to inspect its connections.";
          if (isSphere) drawSphere(); else applySvgFocus();
        }
        function clearFocus(notify = false) {
          const wasFocused = Boolean(focusedNodeId || pendingFocusId); setFocus("");
          if (notify && wasFocused) {
            storeCamera();
            pendingFocusId = ""; pendingClear = true; removeStored(storageKey(contextId, "node")); writeStored(storageKey(contextId, "clear"), "1");
            send("streamlit:setComponentValue", { value: { clear_focus: true, event_id: eventId() } });
          }
        }
        function selectNode(nodeId, event) {
          event?.stopPropagation(); if (!nodeId) return;
          setFocus(nodeId); pendingFocusId = nodeId; pendingClear = false;
          writeStored(storageKey(contextId, "node"), nodeId); removeStored(storageKey(contextId, "clear"));
          storeCamera();
          send("streamlit:setComponentValue", { value: { node_id: nodeId, event_id: eventId() } });
        }

        if (!isSphere) {
          host.innerHTML = sanitizeSvg(args.svg);
          const svgRoot = host.querySelector("svg");
          if (svgRoot) { svgRoot.setAttribute("role", "group"); svgRoot.setAttribute("aria-label", "Interactive Boolean network. Tab to a node and press Enter or Space to select it."); }
          svgNodes = [...host.querySelectorAll("g.node")]; svgEdges = [...host.querySelectorAll("g.edge")];
          [...svgNodes, ...svgEdges].forEach((element) => { const title = element.querySelector("title"); element.dataset.graphId = title ? title.textContent.trim() : ""; });
          host.querySelectorAll("title").forEach((title) => title.remove());
          const labels = new Map(svgNodes.map((node) => [graphId(node), [...node.querySelectorAll("text")].map((text) => text.textContent.trim()).filter(Boolean).join(" ") || graphId(node)]));
          svgNodes.forEach((node) => {
            node.setAttribute("role", "button"); node.setAttribute("tabindex", "0"); node.setAttribute("aria-label", `Node ${labels.get(graphId(node))}. Press Enter or Space to select.`);
            node.addEventListener("click", (event) => selectNode(graphId(node), event));
            node.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectNode(graphId(node), event); } });
          });
          svgRoot?.addEventListener("click", () => clearFocus(true));
        } else {
          host.innerHTML = '<canvas class="sphere-canvas" aria-label="Interactive 3D Boolean network. Drag to rotate, scroll to zoom, and click a node to select it."></canvas><div class="sphere-controls" role="toolbar" aria-label="3D graph controls"><button class="sphere-control" type="button" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button><button class="sphere-control" type="button" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button><button class="sphere-control" type="button" data-action="reset" aria-label="Reset overview" title="Reset overview">⌂</button><button class="sphere-control" type="button" data-action="spin" aria-label="Start automatic rotation" aria-pressed="false" title="Start automatic rotation">▶</button><span class="sphere-control-divider" aria-hidden="true"></span><button class="sphere-control clear-focus" type="button" data-action="clear-focus" aria-label="Clear node focus" title="Clear node focus">⊗</button></div><div class="sphere-help">Drag to rotate · Scroll to zoom · Click a node to focus</div><div class="sphere-accessible" role="group" aria-label="3D Boolean network"></div>';
          const canvas = host.querySelector("canvas"), controls = host.querySelector(".sphere-controls"), context = canvas.getContext("2d");
          host.querySelector(".sphere-accessible").remove();
          canvas.tabIndex = 0;
          canvas.id = "graph-canvas";
          canvas.setAttribute("aria-label", "3D network. Arrow keys rotate; plus and minus zoom; Home resets camera and stops rotation; Escape exits node focus. Select a node in the sidebar to focus its connections.");
          const icon = path => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
          const reset = controls.querySelector('[data-action="reset"]');
          reset.innerHTML = icon('<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>'); reset.setAttribute("aria-label", "Reset camera and stop rotation"); reset.title = "Reset camera and stop rotation";
          const exit = controls.querySelector('[data-action="clear-focus"]');
          exit.innerHTML = icon('<path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6M9 9l6 6m0-6-6 6"/>'); exit.setAttribute("aria-label", "Exit node focus"); exit.title = "Exit node focus";
          host.querySelector(".sphere-help").textContent = "Drag / arrow keys to rotate · Scroll / ± to zoom";
          const nodeCount = (sphere.nodes || []).length;
          const nodeSizeScale = nodeCount <= 40 ? 5 : nodeCount <= 70 ? 3 : 2;
          const radius = Math.max(...(sphere.nodes || []).map((node) => Math.hypot(node.x, node.y, node.z)), 1);
          // Scale by the sphere radius as well as camera depth. This keeps the
          // complete model in frame at its initial rotation, including labels.
          const defaultView = { yaw: -.65, pitch: .35, zoom: 1.8 };
          const cameraKey = storageKey(contextId.slice(0, contextId.lastIndexOf("|")), "camera");
          let initialView = defaultView;
          try { const stored = JSON.parse(readStored(cameraKey)); if (stored && [stored.yaw, stored.pitch, stored.zoom].every(Number.isFinite)) initialView = stored; } catch (_) {}
          const camera = new CanaCameraMotion(initialView);
          const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
          let reducedMotion = motionPreference.matches;
          let autoSpin = false, dragging = false, moved = false, startX = 0, startY = 0, pressX = 0, pressY = 0, screenNodes = [], dragSamples = [], pointerId = null;
          let motionFrame = 0, lastMotionTime = null, inView = true, disposed = false;
          storeCamera = () => writeStored(cameraKey, JSON.stringify(camera.values));
          function project(node, width, height) {
            const { yaw, pitch, zoom } = camera.values;
            const yc = Math.cos(yaw), ys = Math.sin(yaw), pc = Math.cos(pitch), ps = Math.sin(pitch);
            const x1 = node.x * yc + node.z * ys, z1 = -node.x * ys + node.z * yc, y1 = node.y * pc - z1 * ps, z2 = node.y * ps + z1 * pc;
